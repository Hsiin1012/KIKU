<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>iPhone Audio Volume Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #111;
      color: white;

      font-family: sans-serif;
    }

    .panel {
      width: min(90vw, 380px);
      text-align: center;
      padding: 30px 0;
    }

    .section {
      margin: 30px 0;
      padding: 20px;

      border: 1px solid #555;
      border-radius: 14px;
    }

    button {
      display: block;
      width: 100%;

      margin: 10px 0;
      padding: 15px;

      font-size: 17px;

      border: none;
      border-radius: 10px;
    }

    .status {
      margin-top: 15px;

      font-family: monospace;
      line-height: 1.6;
    }
  </style>
</head>


<body>

<div class="panel">

  <h2>iPhone Audio Volume Test</h2>

  <p>
    bgm_daily.ogg
  </p>


  <!-- =========================================
       TEST A
       Native HTMLAudio
       ========================================= -->

  <div class="section">

    <h3>
      A：HTMLAudio
    </h3>

    <button id="native-play">
      ▶ 播放
    </button>

    <button id="native-stop">
      ■ 停止
    </button>

    <div
      id="native-status"
      class="status"
    >
      尚未播放
    </div>

  </div>


  <!-- =========================================
       TEST B
       MediaElementSource + GainNode
       ========================================= -->

  <div class="section">

    <h3>
      B：Web Audio GainNode
    </h3>

    <button id="web-play">
      ▶ 播放
    </button>

    <button data-gain="1">
      Gain 100%
    </button>

    <button data-gain="0.1">
      Gain 10%
    </button>

    <button data-gain="0.01">
      Gain 1%
    </button>

    <button data-gain="0">
      Gain 0%
    </button>

    <button id="web-stop">
      ■ 停止
    </button>

    <div
      id="web-status"
      class="status"
    >
      尚未播放
    </div>

  </div>

</div>


<script>

  /*
   * =========================================
   * 共用測試音檔
   * =========================================
   */

  const TEST_BGM =
    "assets/bgm/bgm_daily.ogg";


  /*
   * =========================================
   * TEST A
   * 原生 HTMLAudio
   * =========================================
   */

  const nativeAudio =
    new Audio(TEST_BGM);

  nativeAudio.loop = true;

  const nativeStatus =
    document.getElementById(
      "native-status"
    );


  document
    .getElementById("native-play")
    .addEventListener(
      "click",
      async () => {

        try {

          nativeAudio.currentTime = 0;

          await nativeAudio.play();

          nativeStatus.textContent =
            "HTMLAudio 播放中";

        } catch (err) {

          console.error(
            "[Native Audio]",
            err
          );

          nativeStatus.textContent =
            "播放失敗：" +
            err.message;
        }
      }
    );


  document
    .getElementById("native-stop")
    .addEventListener(
      "click",
      () => {

        nativeAudio.pause();

        nativeAudio.currentTime = 0;

        nativeStatus.textContent =
          "已停止";
      }
    );



  /*
   * =========================================
   * TEST B
   * HTMLAudio
   * →
   * MediaElementSource
   * →
   * GainNode
   * →
   * Destination
   * =========================================
   */

  let webContext = null;
  let webAudio = null;
  let webSource = null;
  let webGain = null;

  const webStatus =
    document.getElementById(
      "web-status"
    );


  async function startWebAudioTest() {

    /*
     * 已經建立過的話，
     * 不要重複 createMediaElementSource。
     */
    if (webAudio) {

      if (
        webContext &&
        webContext.state === "suspended"
      ) {
        await webContext.resume();
      }

      webAudio.currentTime = 0;

      await webAudio.play();

      webStatus.innerHTML =
        "Web Audio 播放中<br>" +
        "Context: " +
        webContext.state +
        "<br>" +
        "Gain: " +
        webGain.gain.value;

      return;
    }


    try {

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


      if (!AudioContextClass) {

        webStatus.textContent =
          "不支援 AudioContext";

        return;
      }


      /*
       * 建立 AudioContext
       */
      webContext =
        new AudioContextClass();


      /*
       * 建立另一個獨立 Audio。
       *
       * 不使用 TEST A 的 nativeAudio。
       */
      webAudio =
        new Audio(TEST_BGM);

      webAudio.loop = true;


      /*
       * HTMLAudio 本身維持 100%。
       *
       * 真正音量全部交給 GainNode。
       */
      webAudio.volume = 1;


      /*
       * HTMLAudio
       * ↓
       * MediaElementSource
       */
      webSource =
        webContext.createMediaElementSource(
          webAudio
        );


      /*
       * GainNode
       */
      webGain =
        webContext.createGain();

      webGain.gain.value = 1;


      /*
       * 完整路徑：
       *
       * webAudio
       * ↓
       * webSource
       * ↓
       * webGain
       * ↓
       * destination
       */
      webSource.connect(
        webGain
      );

      webGain.connect(
        webContext.destination
      );


      /*
       * iPhone user gesture 內 resume
       */
      if (
        webContext.state === "suspended"
      ) {
        await webContext.resume();
      }


      /*
       * 播放實際 BGM
       */
      await webAudio.play();


      webStatus.innerHTML =
        "Web Audio 播放中<br>" +
        "Context: " +
        webContext.state +
        "<br>" +
        "Gain: " +
        webGain.gain.value;


    } catch (err) {

      console.error(
        "[Web Audio Test]",
        err
      );

      webStatus.innerHTML =
        "播放失敗<br>" +
        err.message;
    }
  }


  document
    .getElementById("web-play")
    .addEventListener(
      "click",
      startWebAudioTest
    );



  /*
   * =========================================
   * Gain buttons
   * =========================================
   */

  document
    .querySelectorAll(
      "[data-gain]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          if (
            !webGain ||
            !webContext
          ) {

            webStatus.textContent =
              "請先按 B 的「播放」";

            return;
          }


          const value =
            Number(
              button.dataset.gain
            );


          webGain.gain.cancelScheduledValues(
            webContext.currentTime
          );


          webGain.gain.setValueAtTime(
            value,
            webContext.currentTime
          );


          webStatus.innerHTML =
            "Web Audio 播放中<br>" +
            "Context: " +
            webContext.state +
            "<br>" +
            "Gain: " +
            webGain.gain.value;
        }
      );
    });



  /*
   * =========================================
   * Stop Web Audio
   * =========================================
   */

  document
    .getElementById("web-stop")
    .addEventListener(
      "click",
      () => {

        if (webAudio) {

          webAudio.pause();

          webAudio.currentTime = 0;
        }


        webStatus.innerHTML =
          "已停止<br>" +
          (
            webContext
              ? "Context: " +
                webContext.state
              : ""
          );
      }
    );

</script>

</body>
</html>
